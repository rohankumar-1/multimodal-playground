[project]
name = "multimodal-playground"
version = "0.1.2"
description = "Blocks for multimodal and multitask learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["multimodal", "multitask", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    # Fill these in before publishing
    { name = "Rohan Kumar", email = "roku@mit.edu" },
]
urls = { "Homepage" = "https://github.com/rohankumar-1/multimodal-playground", "Repository" = "https://github.com/rohankumar-1/multimodal-playground", "Issues" = "https://github.com/rohankumar-1/multimodal-playground/issues" }
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["multimodal*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402", "I001"]
