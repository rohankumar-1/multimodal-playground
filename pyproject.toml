[project]
name = "playground"
version = "0.1.0"
description = "Blocks for multimodal and multitask learning."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

